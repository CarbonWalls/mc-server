<!DOCTYPE html>
<!--
  ============================================================================
  Minecraft Server Manager — Web UI
  ============================================================================

  SCREENS IMPLEMENTED
    · Dashboard      — server/tunnel status, share address, start/stop/kill,
                       disk + java + paper info, live log tail, instance switcher
    · Servers        — every server in one table: path, Paper build, tunnel,
                       bedrock port, state; per-row activate / start / stop /
                       rename / clone / change Paper version / delete
    · Console        — full log view, command input, ↑/↓ history, error/warn marks
    · Players        — online, whitelist, ops, bans, add/remove/op/deop/kick/ban
    · Backups        — list with date + size, create, restore, delete (confirm)
    · Create server  — 6-step wizard (basics, location, software, gameplay,
                       network+plugins, review) with state preserved across steps
    · Connect playit — guided setup: start the agent, claim it, create the two
                       tunnels, record the Bedrock port
    · Settings       — memory, ports, tunnel, Java override (all restart-labelled)
                       and the tunnel account

  ENDPOINTS USED (per contract)
    GET  /api/status
    GET  /api/instances
    POST /api/instances/active
    POST /api/instances/create
    POST /api/instances/delete
    POST /api/instances/rename
    POST /api/instances/clone
    POST /api/instances/settings
    POST /api/instances/paper-version
    POST /api/instances/tunnel-port
    POST /api/server/start | /stop | /kill
    POST /api/console
    GET  /api/logs?instance=&lines=
    GET  /api/players?instance=
    POST /api/players/whitelist/add | /remove
    POST /api/players/op/add | /remove
    POST /api/players/ban | /kick
    GET  /api/backups?instance=
    POST /api/backups/create | /restore | /delete
    GET  /api/tunnels
    GET  /api/paper/versions
    POST /api/playit/start | /stop
    GET  /api/jobs
    GET  /api/events (SSE: status, log, job, players)

  The page is split across index.html + styles.css + app.js in the same
  folder; they are served as-is by the same stdlib http.server, with no
  build step and no external requests.

  MOCK MODE
    Open with ?mock=1 to run entirely against an in-file dataset. No network.
    Without the flag the UI talks to the real API and degrades to an offline
    banner when the backend is unreachable.

  LAYOUT
    Built for 360px up. The Servers table stacks into per-server blocks below
    640px and drops its secondary columns below 900px; every other table drops
    one or two low-priority columns on narrow screens (see styles.css). Nothing
    scrolls horizontally except the wizard's step bar.

  No external requests. No build step. No frameworks. Vanilla DOM only.
  ============================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Minecraft Server Manager</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <!-- ==================== SIDEBAR ==================== -->
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2.5"/>
        <path d="M9.5 3v18M3 9.5h6.5M3 14.5h6.5M14.5 3v18M14.5 9.5H21M14.5 14.5H21"/>
      </svg>
      <div>
        Server Manager
        <small>Minecraft · self-hosted</small>
      </div>
    </div>

    <nav class="nav" id="mainNav" aria-label="Screens"></nav>

    <div class="nav-section" id="instancesHeading">Instances</div>
    <nav class="nav" id="instanceNav" aria-label="Instances"></nav>

    <div class="sidebar-foot">
      <button class="nav-item" id="themeBtn" type="button">
        <span class="icon" id="themeIcon" aria-hidden="true"></span>
        <span class="label" id="themeLabel">Theme</span>
      </button>
    </div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <!-- ==================== MAIN ==================== -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" type="button"
              aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" aria-hidden="true">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="topbar-actions" id="pageActions"></div>
    </header>

    <main class="content" id="content" tabindex="-1"></main>
  </div>
</div>

<!-- Job progress -->
<div class="jobbar" id="jobbar" hidden aria-live="polite">
  <div class="jobbar-track"><div class="jobbar-fill" id="jobbarFill"></div></div>
  <div class="jobbar-msg" id="jobbarMsg" hidden>
    <span class="label" id="jobbarLabel"></span>
    <span class="pct" id="jobbarPct"></span>
  </div>
</div>

<!-- Toasts -->
<div class="toasts" id="toasts" role="region" aria-label="Notifications" aria-live="polite"></div>

<!-- Modal host -->
<div id="modalHost"></div>

<script src="app.js"></script>
</body>
</html>
